<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>99</title>
<meta name="application-name" content="99">
<meta name="apple-mobile-web-app-title" content="99">
<meta name="description" content="99: Kilo's all-in-one AlmondGold grow logger with Towie.">
<meta name="theme-color" content="#1a0638">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/towie.css">
</head>
<body>
<div class="bg"><div class="aurora a1"></div><div class="aurora a2"></div><div class="aurora a3"></div><div class="stars"></div><div class="halftone"></div></div>
<div id="splash"><img src="img/towie_hero.png" alt="Towie"><div class="logo99 big">99</div><div class="splash-sub">AlmondGold grow lab</div></div>
<header class="top">
  <button class="logo-btn" data-go="home" aria-label="Home"><span class="logo99">99</span></button>
  <button class="plant-chip" id="plantChip" aria-label="Switch plant"></button>
  <div class="top-actions">
    <button class="icon-btn" data-go="plants" data-react="plants" aria-label="Plants & timeline"></button>
    <button class="icon-btn" data-go="settings" data-react="settings" aria-label="Settings"></button>
  </div>
</header>
<main id="view" tabindex="-1"></main>
<div id="companion" class="towie" title="Tap Towie"></div>
<nav class="tabs" id="tabs"></nav>
<div id="sheet" class="sheet" aria-hidden="true"><div class="sheet-back"></div><div class="sheet-card"><div class="sheet-grip"></div><div class="sheet-body"></div></div></div>
<div id="toast"></div>
<div id="fx"></div>
<script src="js/data.js"></script>
<script src="js/towie.js"></script>
<script src="js/icons.js"></script>
<script src="js/app.js"></script>
</body>
</html>
